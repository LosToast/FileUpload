spring.application.name=FileUpload


app.aws.region=ap-south-1
app.aws.bucket=iplprojectbucket
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.datasource.url=jdbc:postgresql://localhost:5433/fileuploadmetadata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.flyway.enabled=true
logging.level.org.flywaydb=debug

# flyway
flyway.url=jdbc:postgresql://localhost:5433/fileuploadmetadata
flyway.user=root
flyway.password=root
flyway.driver=org.postgresql.Driver
